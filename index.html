<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1214">
  <meta name="description" content="Al Ajamy Food – متابعة سيارات التوزيع في سوريا">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Al Ajamy Food – سيارات التوزيع</title>
  <style>
    :root {
      --bg: #0d1214;
      --bg2: #090c0e;
      --text: #eef6f6;
      --muted: #a8b8b7;
      --brand: #3d9b85;
      --accent: #e07a1f;
      --red: #ff3b4e;
      --yellow: #ffcc00;
      --amber: #ff8a24;
      --green: #2dd36f;
      --shadow: 0 12px 40px rgba(0,0,0,.4);
      --r: 18px;
      --r2: 14px;
      --fs1: clamp(13px, 1.6vw, 14px);
      --fs2: clamp(15px, 2.1vw, 17px);
      --fs3: clamp(17px, 2.5vw, 20px);
      --fsDays: clamp(28px, 4.5vw, 42px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Kufi Arabic", "Noto Sans Arabic", sans-serif;
      background:
        radial-gradient(900px 600px at 90% -10%, rgba(61,155,133,.15), transparent 55%),
        radial-gradient(800px 500px at 5% 5%, rgba(224,122,31,.1), transparent 50%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      overflow-x: hidden;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 12px 36px; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border-radius: var(--r);
      border: 1px solid rgba(255,255,255,.1);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: var(--shadow);
      position: sticky; top: 8px; z-index: 20;
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .logoBox {
      width: 52px; height: 52px; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25); flex: 0 0 auto;
      display: grid; place-items: center;
    }
    .logoBox img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .title h1 {
      margin: 0; font-size: var(--fs3); font-weight: 900;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .subtitle { margin-top: 2px; color: var(--muted); font-size: var(--fs1); }
    .pill {
      flex: 0 0 auto; padding: 7px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.25);
      color: var(--muted); font-weight: 800; font-size: var(--fs1); white-space: nowrap;
    }
    @media (max-width: 680px) { .topbar { position: static; } }

    .section {
      margin-top: 14px; padding: 12px; border-radius: var(--r);
      border: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.02);
    }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    @media (max-width: 1050px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

    .card {
      border-radius: var(--r); border: 1.5px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(0,0,0,.12));
      box-shadow: var(--shadow); overflow: hidden;
    }
    .cardInner { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

    .metaRow {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    .vehicleName {
      font-size: var(--fs2); font-weight: 900;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .branchTag {
      font-size: 14px; font-weight: 800; padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(61,155,133,.35); background: rgba(61,155,133,.14);
      white-space: nowrap;
    }

    .driverRow {
      font-size: var(--fs1); color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .driverRow b { color: var(--text); font-weight: 800; }
    .phone-link {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text); text-decoration: none; transition: color .15s;
    }
    .phone-link:hover { color: var(--brand); }
    .phone-icon { width: 15px; height: 15px; fill: currentColor; flex: 0 0 auto; }

    /* Syrian official plate – exact modern style */
    .plateWrap {
      display: flex; justify-content: center; width: 100%;
      padding: 2px 0;
    }
    .plate {
      direction: ltr; unicode-bidi: embed;
      display: flex; align-items: stretch;
      border-radius: 10px;
      background: #fff;
      border: 2.5px solid #2a2a2a;
      box-shadow:
        0 0 0 1.5px #c8c8c8,
        0 4px 14px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.7);
      min-width: 260px; max-width: 360px; width: 100%;
      height: 62px;
      overflow: hidden;
      position: relative;
    }
    /* subtle security border effect */
    .plate::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: 8px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(180,180,180,.35);
    }
    .plate .left-num,
    .plate .right-num {
      background: #fff; color: #111;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial Black, "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: 1px;
      line-height: 1;
    }
    .plate .left-num {
      min-width: 58px;
      font-size: 28px;
      padding: 0 6px 0 10px;
    }
    .plate .right-num {
      flex: 1;
      font-size: 28px;
      padding: 0 12px 0 8px;
      letter-spacing: 3px;
      justify-content: flex-start;
    }
    .plate .flag-box {
      width: 52px; flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px;
      padding: 3px 2px;
      background: #fff;
    }
    .plate .flag-box .ar {
      font-size: 11px;
      font-weight: 900;
      color: #111;
      line-height: 1;
      font-family: "Noto Kufi Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
    }
    .plate .flag-box .flag {
      width: 34px; height: 22px;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid #333;
      display: flex; flex-direction: column;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
    .plate .flag-box .flag .stripe {
      flex: 1; width: 100%;
    }
    .plate .flag-box .flag .green { background: #007A3D; }
    .plate .flag-box .flag .white {
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      gap: 2px;
    }
    .plate .flag-box .flag .white .star {
      width: 5px; height: 5px;
      background: #CE1126;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .plate .flag-box .flag .black { background: #000; }
    .plate .flag-box .syr {
      font-size: 10px;
      font-weight: 900;
      color: #111;
      letter-spacing: 0.5px;
      line-height: 1;
      font-family: Arial, Helvetica, sans-serif;
    }
    @media (max-width: 680px) {
      .plate { min-width: 220px; height: 54px; }
      .plate .left-num { font-size: 24px; min-width: 48px; padding: 0 4px 0 8px; }
      .plate .right-num { font-size: 24px; letter-spacing: 2px; padding: 0 8px 0 6px; }
      .plate .flag-box { width: 46px; }
      .plate .flag-box .ar { font-size: 10px; }
      .plate .flag-box .flag { width: 30px; height: 19px; }
      .plate .flag-box .flag .white .star { width: 4px; height: 4px; }
      .plate .flag-box .syr { font-size: 9px; }
    }

    .blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 680px) { .blocks { grid-template-columns: 1fr; } }
    .block {
      border-radius: var(--r2); border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.22); padding: 10px;
    }
    .blockTop {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap;
    }
    .blockTitle { font-size: var(--fs2); font-weight: 900; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.2); font-weight: 800; font-size: 12px; white-space: nowrap;
    }
    .badge svg { width: 14px; height: 14px; flex: 0 0 auto; }
    .badge.urgent, .badge.expired { border-color: rgba(255,59,78,.4); }
    .badge.alert { border-color: rgba(255,204,0,.4); }
    .badge.follow { border-color: rgba(224,122,31,.4); }
    .badge.safe, .badge.long { border-color: rgba(45,211,111,.35); }
    .badge.missing { border-color: rgba(255,255,255,.2); color: rgba(234,242,242,.85); }

    .days { margin-top: 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .daysNum { font-size: var(--fsDays); font-weight: 900; line-height: 1; }
    .daysTxt { font-size: var(--fs2); font-weight: 800; color: rgba(234,242,242,.9); }
    .daysMissing { margin-top: 8px; font-size: var(--fs2); font-weight: 800; color: rgba(234,242,242,.8); }

    .bar {
      margin-top: 8px; height: 9px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.08); overflow: hidden;
    }
    .bar > span { display: block; height: 100%; border-radius: 999px; transition: width .4s ease; }
    .bar.safe > span, .bar.long > span { background: linear-gradient(90deg, #3d9b85, #2dd36f); }
    .bar.follow > span { background: linear-gradient(90deg, #e07a1f, #ff8a24); }
    .bar.alert > span { background: linear-gradient(90deg, #ffcc00, #e07a1f); }
    .bar.urgent > span, .bar.expired > span { background: linear-gradient(90deg, #ff3b4e, #ff5c6c); }
    .bar.missing > span { width: 25%; background: linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.1)); }

    .empty, .loading, .error {
      padding: 28px 16px; border-radius: var(--r);
      border: 1px dashed rgba(255,255,255,.15);
      background: rgba(0,0,0,.2); color: var(--muted); font-weight: 800; text-align: center;
    }
    .error { border-color: rgba(255,59,78,.3); color: #ff8a95; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.15);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
      background: rgba(61,155,133,.15); color: var(--text); font-weight: 700;
      font-size: var(--fs1); cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logoBox">
          <img src="logo.png" alt="Al Ajamy" onerror="this.style.display='none'; this.parentElement.textContent='ع';">
        </div>
        <div class="title">
          <h1>Al Ajamy Food – سيارات التوزيع</h1>
          <div class="subtitle" id="subLine">جاري التحميل...</div>
        </div>
      </div>
      <div class="pill" id="countPill">— سيارة</div>
    </div>

    <div class="section">
      <div class="grid" id="grid">
        <div class="loading"><div class="spinner"></div>جاري تحميل البيانات...</div>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwMa3xvwodCJ8ELoETkcqIMMcW6OjGw7ipazpKOK4j1BpZuVJiNZo2G72YLbAvtfbpP/exec";
  const AUTO_REFRESH_MS = 60000;

  const grid = document.getElementById("grid");
  const subLine = document.getElementById("subLine");
  const countPill = document.getElementById("countPill");

  let allData = [];

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  function parseAnyDate(val) {
    if (val == null || val === "") return null;
    const s = String(val).trim();
    if (!s) return null;
    if (/^\d{1,2}[-\/]\d{1,2}[-\/]\d{4}$/.test(s)) {
      const parts = s.split(/[-\/]/).map(Number);
      const dt = new Date(parts[2], parts[1] - 1, parts[0]);
      return isNaN(dt.getTime()) ? null : dt;
    }
    if (/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/.test(s)) {
      const parts = s.split(/[-\/]/).map(Number);
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return isNaN(dt.getTime()) ? null : dt;
    }
    const fallback = new Date(s);
    return isNaN(fallback.getTime()) ? null : fallback;
  }

  function daysRemaining(dateVal) {
    const dt = parseAnyDate(dateVal);
    if (!dt) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const x = new Date(dt);
    x.setHours(0, 0, 0, 0);
    return Math.round((x - today) / 86400000);
  }

  function statusForDays(d) {
    if (d === null) return { type: "missing", label: "غير محدد" };
    if (d < 0) return { type: "expired", label: "منتهية" };
    if (d <= 15) return { type: "urgent", label: "عاجل" };
    if (d <= 30) return { type: "alert", label: "تنبيه" };
    if (d <= 60) return { type: "follow", label: "متابعة" };
    if (d <= 120) return { type: "safe", label: "المدة آمنة" };
    return { type: "long", label: "مدة طويلة" };
  }

  function barWidth(d) {
    if (d === null) return 25;
    if (d < 0) return 100;
    return Math.min(100, Math.max(4, Math.round(d / 200 * 100)));
  }

  function svgDot(color) {
    return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="${color}"/></svg>`;
  }

  function badgeIcon(type) {
    if (type === "alert") {
      return `<svg viewBox="0 0 24 24"><path fill="#ffcc00" d="M12 3 1 21h22L12 3z"/><path fill="#111" d="M11 9h2v6h-2z"/><circle cx="12" cy="18" r="1.2" fill="#111"/></svg>`;
    }
    if (type === "urgent" || type === "expired") {
      return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff3b4e"/><path fill="#fff" d="M11 7h2v8h-2z"/><circle cx="12" cy="17.6" r="1.2" fill="#fff"/></svg>`;
    }
    if (type === "follow") return svgDot("#ff8a24");
    if (type === "missing") return svgDot("rgba(255,255,255,.35)");
    return svgDot("#2dd36f");
  }

  function blockHTML(title, days) {
    const st = statusForDays(days);
    const w = barWidth(days);
    const shown = days === null ? null : (days < 0 ? 0 : days);
    const daysPart = shown === null
      ? `<div class="daysMissing">غير محدد</div>`
      : `<div class="days"><div class="daysNum">${shown}</div><div class="daysTxt">يوم متبقي</div></div>`;
    return `
      <div class="block">
        <div class="blockTop">
          <div class="blockTitle">${title}</div>
          <div class="badge ${st.type}">${badgeIcon(st.type)}<span>${st.label}</span></div>
        </div>
        ${daysPart}
        <div class="bar ${st.type}"><span style="width:${w}%"></span></div>
      </div>`;
  }

  function splitPlate(raw) {
    const s = String(raw || "").trim();
    if (!s) return { left: "—", right: "" };
    const parts = s.split(/\s*\/\s*/);
    if (parts.length >= 2) {
      return { left: parts[0].trim() || "—", right: parts.slice(1).join(" ").trim() };
    }
    return { left: "", right: s };
  }

  function cardHTML(row) {
    const plateRaw = String(row.plate || "").trim();
    const { left, right } = splitPlate(plateRaw);
    const vehicle = row.vehicle || "—";
    const branch = row.branch || "—";
    const driver = row.driver || "—";
    const phone = String(row.phone || "").trim();
    const inspDays = daysRemaining(row.inspection_date);
    const perDays = daysRemaining(row.periodic_date);

    const phonePart = phone
      ? `<a href="tel:${phone.replace(/\D/g, '')}" class="phone-link" dir="ltr">
           <svg class="phone-icon" viewBox="0 0 24 24"><path d="M6.62 10.79a15.1 15.1 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.22 11.36 11.36 0 003.57.57 1 1 0 011 1v3.5a1 1 0 01-1 1A18 18 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.57 1 1 0 01-.22 1.11l-2.2 2.2z"/></svg>
           ${escapeHtml(phone)}
         </a>`
      : `<span style="opacity:.55">لا يوجد رقم</span>`;

    const leftHtml = left
      ? `<div class="left-num">${escapeHtml(left)}</div>`
      : `<div class="left-num" style="min-width:12px;padding:0"></div>`;

    return `
      <div class="card">
        <div class="cardInner">
          <div class="metaRow">
            <div class="vehicleName" title="${escapeHtml(vehicle)}">${escapeHtml(vehicle)}</div>
            <div class="branchTag">${escapeHtml(branch)}</div>
          </div>

          <div class="plateWrap">
            <div class="plate" title="لوحة سورية – ${escapeHtml(plateRaw)}">
              ${leftHtml}
              <div class="flag-box">
                <div class="ar">سورية</div>
                <div class="flag">
                  <div class="stripe green"></div>
                  <div class="stripe white">
                    <span class="star"></span>
                    <span class="star"></span>
                    <span class="star"></span>
                  </div>
                  <div class="stripe black"></div>
                </div>
                <div class="syr">SYR</div>
              </div>
              <div class="right-num">${escapeHtml(right || "—")}</div>
            </div>
          </div>

          <div class="driverRow">
            <span>السائق: <b>${escapeHtml(driver)}</b></span>
            ${phonePart}
          </div>

          <div class="blocks">
            ${blockHTML("المعاينة", inspDays)}
            ${blockHTML("الفحص الدوري", perDays)}
          </div>
        </div>
      </div>`;
  }

  function minDue(d1, d2) {
    const arr = [d1, d2].filter(v => v !== null);
    if (!arr.length) return 999999;
    if (arr.some(v => v < 0)) return -999999;
    return Math.min(...arr);
  }

  function render(data) {
    countPill.textContent = data.length + " سيارة";
    if (!data.length) {
      grid.innerHTML = `<div class="empty">لا توجد بيانات حالياً</div>`;
      return;
    }
    const sorted = [...data].sort((a, b) => {
      const aDue = minDue(daysRemaining(a.inspection_date), daysRemaining(a.periodic_date));
      const bDue = minDue(daysRemaining(b.inspection_date), daysRemaining(b.periodic_date));
      return aDue - bDue;
    });
    grid.innerHTML = sorted.map(cardHTML).join("");
  }

  function jsonpLoad() {
    return new Promise((resolve, reject) => {
      const cb = "__cb_" + Date.now() + Math.random().toString(36).slice(2, 8);
      const script = document.createElement("script");
      const src = API_URL + (API_URL.includes("?") ? "&" : "?") + "callback=" + cb + "&_=" + Date.now();
      const timeout = setTimeout(() => { cleanup(); reject(new Error("انتهت مهلة الاتصال")); }, 18000);
      window[cb] = data => { cleanup(); resolve(data); };
      function cleanup() {
        clearTimeout(timeout);
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      script.src = src;
      script.onerror = () => { cleanup(); reject(new Error("فشل تحميل البيانات")); };
      document.head.appendChild(script);
    });
  }

  async function load(showLoading = true) {
    if (showLoading) {
      grid.innerHTML = `<div class="loading"><div class="spinner"></div>جاري تحميل البيانات...</div>`;
    }
    try {
      const res = await jsonpLoad();
      if (!res || res.ok !== true) throw new Error(res?.error || "استجابة غير صالحة");
      allData = Array.isArray(res.data) ? res.data : [];
      subLine.textContent = "آخر تحديث: " + new Date().toLocaleString("ar-SY", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
      render(allData);
    } catch (err) {
      grid.innerHTML = `
        <div class="error">
          تعذر تحميل البيانات<br>
          <small style="opacity:.8">${escapeHtml(err.message || String(err))}</small><br><br>
          <button class="btn" type="button" onclick="load(true)">إعادة المحاولة</button>
        </div>`;
      countPill.textContent = "— سيارة";
      subLine.textContent = "آخر تحديث: —";
    }
  }

  load(true);
  setInterval(() => load(false), AUTO_REFRESH_MS);
</script>
</body>
</html>
